# Local Supabase. Remote project (owner's choice): stead-dev, us-east-1, ref aqkjkarrhancuqxxukus.

project_id = "stead"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
# Magic link is the Slice 1 auth path. Google OAuth is deferred until a client is supplied.

[functions.create-booking]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.expire-pending]
verify_jwt = false
