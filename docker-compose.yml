# Local dependencies for development. Production runs on Neon Postgres — see
# README "Database". Secrets stay in .env, never in git.
#
#   docker compose up -d db
#   export DATABASE_URL_OWNER=postgres://postgres:postgres@127.0.0.1:5432/stead
#   npm run db:migrate && npm run db:bootstrap-roles && npm run db:seed
#
# db:bootstrap-roles prints DATABASE_URL (app_user) and AUTH_DATABASE_URL
# (auth_user) — the app runs as those, never as the owner.
#
# Tests use the throwaway db_test service:
#   docker compose --profile test up -d db_test
#   DATABASE_URL_OWNER=postgres://postgres:postgres@127.0.0.1:5433/stead_test npm test

services:
  db:
    # Neon runs Postgres 17; match it locally so behaviour does not drift.
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stead
    ports:
      - "5432:5432"
    volumes:
      - stead_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stead"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_test:
    image: postgres:17
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stead_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stead_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for listing photos and claim evidence.
  # Console at http://127.0.0.1:9001 (minioadmin / minioadmin).
  storage:
    image: minio/minio
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - stead_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stead_pg:
  stead_minio:
