# Self-host path for Slice 1: Postgres with btree_gist.
# Apply migrations, then seed. Secrets stay in .env — never in git.
#
#   docker compose up -d db
#   export DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/stead
#   psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260830180000_slice1_foundation.sql
#   # Seed needs a real auth.users row on hosted Supabase; locally `supabase db reset` runs seed.sql
#
# Full local stack (Auth, Studio, edge functions): `supabase start` after `supabase link`
# to the owner's project (stead-dev, us-east-1, ref aqkjkarrhancuqxxukus) or a fresh one.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stead
    ports:
      - "5432:5432"
    volumes:
      - stead_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stead"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_test:
    image: postgres:16
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stead_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stead_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stead_pg:
